<!doctype html>
<meta charset="utf-8">
<title>Probe 6 — WebGL2 texture limits on the target machine</title>
<body>
<script>
// Architecture.md §14 Probe 6: can the target integrated GPU hold the textures
// the client design assumes? Allocates a 1024x512x41 R8 TEXTURE_2D_ARRAY (the
// worst case an early design considered), uploads data, samples two layers with
// mix(), and reports every relevant limit. The CURRENT design (per-frame
// ImageBitmaps as ImageryLayers) is far lighter — this probe bounds the
// headroom above it.
window.runProbe = () => {
  const out = { ok: false, limits: {}, alloc: {}, draw: {}, errors: [] };
  try {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;
    const gl = canvas.getContext("webgl2");
    if (!gl) { out.errors.push("no WebGL2 context"); return out; }

    out.limits = {
      renderer: (() => {
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "masked";
      })(),
      MAX_TEXTURE_SIZE: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      MAX_ARRAY_TEXTURE_LAYERS: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
      MAX_3D_TEXTURE_SIZE: gl.getParameter(gl.MAX_3D_TEXTURE_SIZE),
      MAX_TEXTURE_IMAGE_UNITS: gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS),
      MAX_RENDERBUFFER_SIZE: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
    };

    // Allocate 1024x512x41 R8 (~21.5 MB) and a 579x566x12 RGBA8 (~15.7 MB — the
    // real hero-fine footprint if it were array-resident all at once).
    const cases = [
      { name: "1024x512x41 R8", w: 1024, h: 512, d: 41, fmt: "R8" },
      { name: "579x566x12 RGBA8", w: 579, h: 566, d: 12, fmt: "RGBA8" },
    ];
    for (const c of cases) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
      const internal = c.fmt === "R8" ? gl.R8 : gl.RGBA8;
      const format = c.fmt === "R8" ? gl.RED : gl.RGBA;
      const bpp = c.fmt === "R8" ? 1 : 4;
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, internal, c.w, c.h, c.d);
      const layer = new Uint8Array(c.w * c.h * bpp);
      for (let i = 0; i < layer.length; i++) layer[i] = (i * 7) & 0xff;
      for (let z = 0; z < c.d; z++) {
        gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, z, c.w, c.h, 1, format, gl.UNSIGNED_BYTE, layer);
      }
      const err = gl.getError();
      out.alloc[c.name] = err === gl.NO_ERROR ? "OK" : `GL error 0x${err.toString(16)}`;
      gl.deleteTexture(tex);
    }

    // Draw test: sample two layers of a small array with mix() and read back.
    const vs = `#version 300 es
      void main(){ vec2 p = vec2(gl_VertexID==1?3.:-1., gl_VertexID==2?3.:-1.);
        gl_Position = vec4(p,0,1); }`;
    const fs = `#version 300 es
      precision highp float; precision highp sampler2DArray;
      uniform sampler2DArray u_t; out vec4 o;
      void main(){ vec2 uv = gl_FragCoord.xy/256.;
        o = mix(texture(u_t, vec3(uv,0.)), texture(u_t, vec3(uv,1.)), 0.5); }`;
    const prog = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
        out.errors.push(gl.getShaderInfoLog(sh));
      gl.attachShader(prog, sh);
    }
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) out.errors.push(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, 4, 4, 2);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, 4, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array(64).fill(100));
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 1, 4, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array(64).fill(200));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(4);
    gl.readPixels(128, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    out.draw = { readback: Array.from(px), expected: 150, pass: px[0] === 150 };

    out.ok = out.errors.length === 0 &&
      Object.values(out.alloc).every(v => v === "OK") && out.draw.pass;
  } catch (e) { out.errors.push(String(e)); }
  return out;
};
</script>
