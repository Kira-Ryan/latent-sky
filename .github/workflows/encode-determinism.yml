# Pipeline tests — Architecture.md §11.
#
# What this job is NOT, and why the previous version of it was removed on 6 Sep
# 2026: the re-encode gate ("download the released Zarr, re-encode, git diff the
# committed data/web") never ran. No GitHub Release has ever carried a Zarr, the
# step it would have called (`make encode`) does not exist, and the daily runs
# never enter git at all: the pod publishes straight to S3. Keeping the steps
# made the workflow describe a gate the repository did not have.
#
# What does hold, and is tested here on every push: the pipeline suite, which
# includes a two-clean-encodes sorted-inventory-and-bytes comparison for the
# public tree (test_encode_public.py) and the identity guards that refuse to pair
# a run with another run's stores or results (test_identity_guards.py).
name: encode-determinism

on:
  push:
    paths:
      - "pipeline/**"
      - "schema/**"
      - "Makefile"
      - ".github/workflows/encode-determinism.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "schema/**"
      - "Makefile"
      - ".github/workflows/encode-determinism.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: pipeline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: python -m pip install -e "pipeline[dev]"

      - name: pytest
        working-directory: pipeline
        run: python -m pytest -q
