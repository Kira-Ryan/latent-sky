# Licence audit — Architecture.md §12.
# Fails if any pipeline config/module references a model or data asset that has no
# entry in licences/MANIFEST.yaml. Deny-unknown heuristic: every ngc://, hf://,
# gs://, s3:// URI and every known package name in the scan set must be covered.
name: licences

on:
  push:
    paths:
      - "pipeline/**"
      - "licences/**"
      - ".github/workflows/licences.yml"
  workflow_dispatch:

jobs:
  audit:
    name: licence manifest audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Audit asset references against licences/MANIFEST.yaml
        run: python pipeline/tools/licence_audit.py
