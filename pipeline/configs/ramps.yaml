# Latent Sky colour ramps — Architecture.md §7.1, verbatim.
#
# vmin/vmax are GLOBAL per variable: identical for coarse and fine, for every frame,
# forever. Per-layer autoscale is a build failure (§7.2b), enforced in manifest.py.
# The wind and reflectivity ranges are MEASURED from the package's five real sample
# timesteps (Probe 2), one of which is Typhoon Chanthu (2021-09-12).
#
# Ramps are baked ONCE into 256x1 RGBA LUT PNGs (luts/<var>.lut.png) by
# `python -m latentsky.ramps`. The encoder indexes the file and never calls a
# colormap library at encode time (§7.2a).
#
# alpha:
#   policy: opaque            -> alpha = 255 everywhere
#   policy: ramp              -> alpha = 0 at values <= zero_below, linear to 255 by one_by
#
# All colormap sources are MIT: Crameri 8.0.1 (cmcrameri), cmocean, cmweather.

wind10m:
  label: "10 m wind speed"
  units: "m/s"
  cmap: "cmcrameri:batlowK"     # published explicitly for dark backgrounds
  vmin: 0.0
  vmax: 55.0                    # measured fine max 52.24 m/s — 0-40 would clip the typhoon
  alpha:
    policy: ramp
    zero_below: 2.0
    one_by: 6.0

t2m:
  label: "2 m temperature"
  units: "K"
  cmap: "cmocean:thermal"
  vmin: 233.15
  vmax: 323.15
  alpha:
    policy: opaque

mrr:
  label: "Radar reflectivity"
  units: "dBZ"                  # dBZ is already logarithmic — the ramp is linear in dBZ
  cmap: "cmweather:ChaseSpectral"
  vmin: 0.0
  vmax: 55.0                    # measured max 52.35 dBZ; -10..65 wastes a fifth of the ramp
  alpha:
    policy: ramp
    zero_below: 0.0
    one_by: 5.0

refc:
  label: "Composite reflectivity"
  units: "dBZ"
  # A SEPARATE entry from mrr, deliberately. Both are reflectivity in dBZ, but
  # §7.2b makes vmin/vmax global per variable FOREVER, so widening mrr's ceiling
  # to fit US supercells would retroactively rescale the two shipped Taiwan
  # events — every frame of them would change colour. A new variable is the only
  # way to give StormCast a range that fits without rewriting history.
  cmap: "cmweather:ChaseSpectral"   # same ramp as mrr, so the two read alike
  vmin: 0.0
  # HRRR composite reflectivity for this outbreak reached 61.56 dBZ on a real
  # fetch, and supercell cores routinely exceed that; mrr's 55 ceiling would clip
  # exactly the storms this event exists to show. 75 is the conventional top of a
  # US radar scale and leaves headroom without wasting much ramp.
  vmax: 75.0
  alpha:
    policy: ramp
    zero_below: 5.0             # below ~5 dBZ is clear air; keep the globe visible
    one_by: 15.0

prob40:
  label: "Probability of ≥ 40 dBZ"
  units: "%"
  # Ensemble agreement: the share of StormCast members (same initial condition,
  # only the diffusion sampler's seed differs) at or above 40 dBZ in each cell.
  # 40 dBZ is the threshold the FSS verification scores, so the layer and the
  # score talk about the same thing. Sequential, dark to bright: solar starts
  # near-black, so low agreement stays quiet on the dark globe and confident
  # cells glow.
  cmap: "cmocean:solar"
  vmin: 0.0
  vmax: 100.0
  alpha:
    policy: ramp
    zero_below: 5.0             # no member, or one in twenty: nothing to show
    one_by: 30.0                # a quarter of the members agreeing is worth a solid cell

tcwv:
  label: "Total column water vapour"
  units: "kg/m²"
  cmap: "cmcrameri:davos"
  vmin: 0.0
  # 80, not the doc's original 70: real ERA5 over the five dev frames peaks at
  # 79.58 kg/m² (Chanthu) — a 70 ceiling would saturate exactly the event that
  # matters. Safe to widen: tcwv has no hero pair, so no identity conflict.
  vmax: 80.0
  alpha:
    policy: opaque

msl:
  label: "Mean sea-level pressure"
  units: "hPa"
  cmap: "cmcrameri:vik"         # diverging, midpoint 1013.25 hPa (§7.1)
  # §7.1 fixes only the midpoint. The span is symmetric about it so the ramp's neutral
  # centre sits exactly on 1013.25 hPa; ±80 hPa is provisional until the first GPU run
  # measures the real MSLP span (msl is not encodable from the dev sample anyway).
  vmin: 933.25
  vmax: 1093.25
  midpoint: 1013.25
  alpha:
    policy: opaque
