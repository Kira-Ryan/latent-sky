<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070c1a" />
    <meta
      name="description"
      content="Latent Sky — AI weather, rendered as a living globe. A generative model turns 25 km input into kilometre-scale typhoon detail, served as a folder of static files."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Latent Sky — AI weather, rendered as a living globe" />
    <meta
      property="og:description"
      content="A dark, quiet Earth with weather flowing across it — and a fly-down into a typhoon where a generative AI model produces roughly 2 km detail from roughly 25 km input."
    />
    <!-- og.png is LICENCE-CLEAN by construction: rendered from the publishable
         stack only (Natural Earth basemap, public domain + global ERA5 water
         vapour, CC-BY) by web/tests/capture-og.mjs, whose audit gate fails the
         capture if any hero (CC BY-NC-ND-derived) layer exists in the scene.
         Never replace it with a hero capture. URLs are absolute per the OG
         spec, against the project domain (schema/manifest.schema.json $id). -->
    <meta property="og:url" content="https://latent-sky.dev/" />
    <meta property="og:image" content="https://latent-sky.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="A dark planet with ERA5 water vapour flowing across it, titled Latent Sky."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://latent-sky.dev/og.png" />
    <title>Latent Sky — AI weather, rendered as a living globe</title>
    <!-- Favicon: the dark planet with the cyan arc — inline, zero requests. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23070c1a'/%3E%3Cpath d='M2.7 11.2 A6 6 0 0 1 8.6 2.1' fill='none' stroke='%234fd1c5' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
